name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Detect pre-release
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" =~ -(alpha|rc) ]]; then
            echo "pre_release=true" >> $GITHUB_OUTPUT
          else
            echo "pre_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/release-notes/latest.md"

          if [ -f "$NOTES_FILE" ]; then
            # 使用 AI 编写的更新说明
            cp "$NOTES_FILE" release_body.md
          else
            # 自动生成（兜底）
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
            else
              CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
            fi
            printf '## 更新内容\n%s\n\n---\n**完整变更记录**: https://github.com/%s/commits/%s\n' \
              "$CHANGELOG" "${{ github.repository }}" "${{ github.ref_name }}" > release_body.md
          fi

          gh release create "${{ github.ref_name }}" \
            --title "SyncMaterial ${{ github.ref_name }}" \
            --notes-file release_body.md \
            $( [[ "${{ steps.prerelease.outputs.pre_release }}" == "true" ]] && echo "--prerelease" ) \
            build/libs/*.jar

name: CI

on:
  push:
    branches: [dev, 'feature/**', '*-lts']
  pull_request:
    branches: [dev, 'feature/**', '*-lts']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 安装两个 JDK，JAVA_HOME 默认指向最后安装的 21；
      # Gradle toolchain（languageVersion 按 minecraft_mapping 决定 21 或 25）
      # 会自动探测到另一个已安装的版本
      - name: Setup Java 25 (for MC 26.x)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      # 打包产物守卫：F1（分发 jar 漏嵌套 sqlite 驱动）曾全绿逃逸，
      # 构建成功不代表产物正确，这里直接断言 jar 内容
      - name: Verify distributable jar contents
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "检查 $JAR"
          test -n "$JAR"
          unzip -l "$JAR" | grep -q "META-INF/jars/sqlite-jdbc" \
            || { echo "::error::分发 jar 未嵌套 sqlite-jdbc 驱动"; exit 1; }
          unzip -l "$JAR" | grep -q "syncmaterial.mixins.json" \
            || { echo "::error::分发 jar 缺少 mixins 清单"; exit 1; }
          unzip -p "$JAR" fabric.mod.json | python3 -c \
            "import json,sys; m=json.load(sys.stdin); assert m['entrypoints'], 'entrypoints 为空'" \
            || { echo "::error::fabric.mod.json 异常"; exit 1; }
          echo "产物检查通过"

      - name: Static analysis
        if: always()
        run: ./gradlew spotbugsMain

      - name: Static analysis summary
        if: always()
        run: |
          echo "## 静态分析（SpotBugs）" >> $GITHUB_STEP_SUMMARY
          if [ -f build/reports/spotbugs/main.xml ]; then
            python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET, collections
          root = ET.parse('build/reports/spotbugs/main.xml').getroot()
          bugs = root.findall('BugInstance')
          pri = collections.Counter(b.get('priority') for b in bugs)
          names = {'1': '高', '2': '中', '3': '低'}
          parts = [f"{names.get(k, k)} {pri[k]}" for k in ('1', '2', '3') if pri[k]]
          print(f"- 共 {len(bugs)} 条（{'，'.join(parts) if parts else '无'}）")
          high = [b for b in bugs if b.get('priority') == '1']
          if high:
              print("")
              print("| 类型 | 位置 |")
              print("|---|---|")
              for b in high:
                  cls = b.find('Class')
                  line = b.find('SourceLine')
                  name = cls.get('classname', '?').split('.')[-1] if cls is not None else '?'
                  at = line.get('start', '?') if line is not None else '?'
                  print(f"| {b.get('type')} | {name}:{at} |")
          EOF
          else
            echo "- 报告未生成" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test summary
        if: always()
        run: |
          echo "## 测试结果" >> $GITHUB_STEP_SUMMARY
          if ls build/test-results/test/*.xml >/dev/null 2>&1; then
            python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob('build/test-results/test/*.xml'):
              root = ET.parse(f).getroot()
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0)) + int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f"- 单元测试: {total} 个（失败 {failed}，跳过 {skipped}）")
          EOF
          else
            echo "- 测试未运行（编译失败？）" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f build/reports/jacoco/test/jacocoTestReport.xml ]; then
            echo "## 覆盖率（JaCoCo 指令级）" >> $GITHUB_STEP_SUMMARY
            python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET
          root = ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot()
          for counter in root.findall('counter'):
              if counter.get('type') == 'INSTRUCTION':
                  missed = int(counter.get('missed')); covered = int(counter.get('covered'))
                  pct = covered * 100 // (missed + covered) if (missed + covered) else 0
                  print(f"- 指令覆盖率: {pct}%（覆盖 {covered} / 未覆盖 {missed}）")
          EOF
          fi

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: SyncMaterial-jar
          path: build/libs/*.jar
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
            build/reports/spotbugs/
          retention-days: 7

  # 客户端 GameTest 独立成 job：它要起真实 MC 客户端（需要虚拟显示器与软件渲染），
  # 耗时与不稳定性都高于主构建，不该拖住主流程。
  # 主构建（build-and-test）不依赖本 job，本 job 也不阻塞 jar 产物上传。
  client-gametest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25 (for MC 26.x)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 真实客户端需要 GL 上下文。CI runner 无显卡，用 Mesa 软件渲染 +
      # xvfb 虚拟显示器；缺 libgl1/libglx-mesa0 会在窗口创建阶段直接崩
      - name: Install virtual display and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri mesa-vulkan-drivers \
            libxi6 libxcursor1 libxrandr2 libxinerama1 libxxf86vm1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # runDir 在 build.gradle 里被指向 /tmp（本地 exFAT 不支持文件锁），
      # CI 上同样落在 /tmp，这里先建好避免首次运行找不到目录
      - name: Prepare run directory
        run: mkdir -p /tmp/syncmaterial-gametest/run-client

      # 1.21.7-lts 目前 enableClientGameTests = false，runClientGameTest 任务不存在。
      # 探测而非硬失败：等那边开启开关后本 job 自动开始生效，无需再改 CI
      - name: Detect client GameTest support
        id: detect
        run: |
          if ./gradlew -q help --task runClientGameTest >/dev/null 2>&1; then
            echo "supported=true" >> $GITHUB_OUTPUT
            echo "本分支已启用客户端 GameTest"
          else
            echo "supported=false" >> $GITHUB_OUTPUT
            echo "本分支未启用客户端 GameTest，跳过"
          fi

      - name: Run client GameTest
        if: steps.detect.outputs.supported == 'true'
        env:
          # 强制软件渲染：runner 没有硬件 GL，走 llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_GL_VERSION_OVERRIDE: 4.6
          MESA_GLSL_VERSION_OVERRIDE: 460
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            ./gradlew runClientGameTest --stacktrace

      - name: Client GameTest summary
        if: always()
        run: |
          echo "## 客户端 GameTest" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.detect.outputs.supported }}" != "true" ]; then
            echo "- 本分支未启用（enableClientGameTests = false），已跳过" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            echo "- 全部通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 失败，详见日志与上传的 run 目录" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 测试类清单（fabric-client-gametest entrypoint）：" >> $GITHUB_STEP_SUMMARY
          python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('src/gametest/resources/fabric.mod.json') as f:
              m = json.load(f)
          for cls in m['entrypoints'].get('fabric-client-gametest', []):
              print(f"  - {cls.split('.')[-1]}")
          EOF

      # 失败时把客户端日志与崩溃报告捞出来，否则只能看 Gradle 的转述
      - name: Upload client run artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: client-gametest-run
          path: |
            /tmp/syncmaterial-gametest/run-client/logs/
            /tmp/syncmaterial-gametest/run-client/crash-reports/
            /tmp/syncmaterial-gametest/run-client/screenshots/
          retention-days: 7
          if-no-files-found: ignore

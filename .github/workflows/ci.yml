name: CI

on:
  push:
    branches: [dev, 'feature/**', 'rewrite/**', '*-lts']
  pull_request:
    branches: [dev, 'feature/**', 'rewrite/**', '*-lts']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 版本节点只来自 versions/versions.json；矩阵由预检 job 生成。
# scripts/verify_multiversion.py（架构/包守卫）按 scope 分阶段执行，不裸跑 all：
#   static   -> 预检 job（只读源码/清单）
#   shared   -> shared job（共享 SpotBugs 基线 0 单独核验）
#   matrix 节点 -> unit / server / optional / package / spotbugs 各自带 --node
#   client 节点 -> client 带 --node
# 该脚本从 --root 读取 versions/versions.json；若其参数约定变化，只改下列入口。

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Version and test registry summary
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py info --root . | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Multiversion static guard
        run: |
          test -f scripts/verify_multiversion.py \
            || { echo "::error::缺少 scripts/verify_multiversion.py（static scope）"; exit 1; }
          python3 -I scripts/verify_multiversion.py --root . --scope static

      - name: Build matrix from versions/versions.json
        id: matrix
        run: echo "matrix=$(python3 -I .github/scripts/ci_guard.py matrix --root .)" >> "$GITHUB_OUTPUT"

  shared:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 构建 JVM 固定 Java 25；toolchain 同时探测 21 与 25。
      - name: Setup Java 21 (toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Java 25 (build JVM)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle (shared)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-shared-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'versions/versions.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-shared-
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 共享模块没有 Minecraft 依赖；显式跑纯测试并产出 shared jar，
      # 供 verify_multiversion shared scope 核验（不能只靠 build 的退出码）。
      - name: Shared pure tests, jar, JaCoCo and SpotBugs
        run: >
          ./gradlew :shared:clean :shared:test :shared:jar :shared:spotbugsMain
          :shared:jacocoTestReport --no-build-cache --stacktrace

      # shared scope 需要真实构建产物，必须放在 shared 执行之后；静态检查已在 preflight。
      - name: Multiversion shared guard
        run: |
          test -f scripts/verify_multiversion.py \
            || { echo "::error::缺少 scripts/verify_multiversion.py（shared scope）"; exit 1; }
          python3 -I scripts/verify_multiversion.py --root . --scope shared

      - name: Shared unit test summary
        run: |
          set -o pipefail
          echo "## 共享模块（不含 Minecraft）" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -I .github/scripts/ci_guard.py unit --suite shared \
            --results shared/build/test-results/test \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # shared SpotBugs 基线由 verify_multiversion shared scope 独立核验（0 条）。
      - name: Shared SpotBugs summary
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py spotbugs --suite shared \
            --report shared/build/reports/spotbugs/main.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Shared JaCoCo summary
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py jacoco --suite shared \
            --report shared/build/reports/jacoco/test/jacocoTestReport.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # 根聚合任务必须显式覆盖 shared 与三个节点；用 dry-run 校验任务图，
      # 不重复执行真实测试（真实测试由各 matrix job 负责）。
      - name: Verify root aggregate task graph
        run: |
          ./gradlew buildAllVersions checkAllVersions testAllClients testOptionalDependencies \
            --dry-run --no-build-cache --stacktrace > "$RUNNER_TEMP/aggregates.log"
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py aggregates --root . \
            --log "$RUNNER_TEMP/aggregates.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload shared reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shared-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            shared/build/reports/jacoco/
            shared/build/reports/spotbugs/
          retention-days: 7
          if-no-files-found: ignore

  platform:
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21 (toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Java 25 (build JVM)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle (${{ matrix.node }})
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'versions/versions.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.slug }}-
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Stonecutter 只允许从根 src 生成节点源，构建前后根 src 哈希必须一致。
      - name: Record root source hash before generation
        run: |
          python3 -I .github/scripts/ci_guard.py source-hash --root . --path src \
            --out "$RUNNER_TEMP/src-before-${{ matrix.slug }}.sha"

      - name: Prepare server run directories
        run: |
          mkdir -p ".runs/${{ matrix.node }}/legacy-server" \
                   ".runs/${{ matrix.node }}/foundation-server" \
                   ".runs/${{ matrix.node }}/optional-legacy-server" \
                   ".runs/${{ matrix.node }}/optional-foundation-server"

      - name: Start platform summary
        run: echo "## 平台回归 ${{ matrix.node }}（Java ${{ matrix.java }}）" >> "$GITHUB_STEP_SUMMARY"

      # 先 clean + 禁用构建缓存，强制 Stonecutter 重新生成节点源并使单测真实执行。
      - name: Build, unit tests and SpotBugs
        run: >
          ./gradlew :${{ matrix.node }}:clean :${{ matrix.node }}:build
          :${{ matrix.node }}:spotbugsMain :${{ matrix.node }}:test
          --no-build-cache --stacktrace

      # 四个服务端回归分开执行，任一失败后仍尝试其余后端，避免一条失败掩盖其它缺口。
      - name: Legacy server GameTest
        if: always()
        run: ./gradlew :${{ matrix.node }}:runGameTest --no-build-cache --stacktrace

      - name: Foundation server GameTest
        if: always()
        run: ./gradlew :${{ matrix.node }}:runFoundationGameTest --no-build-cache --stacktrace

      - name: Optional dependency legacy server GameTest
        if: always()
        run: ./gradlew :${{ matrix.node }}:runOptionalGameTest --no-build-cache --stacktrace

      - name: Optional dependency foundation server GameTest
        if: always()
        run: ./gradlew :${{ matrix.node }}:runOptionalFoundationGameTest --no-build-cache --stacktrace

      - name: Verify source hash unchanged
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py source-compare --root . --path src \
            --before "$RUNNER_TEMP/src-before-${{ matrix.slug }}.sha" | tee -a "$GITHUB_STEP_SUMMARY"

      # 每个 scope 单独调用，避免依赖逗号分隔支持，也不在单节点裸跑 all。
      # optional 已按 optional-server / optional-client 拆分，各自只在对应 job 执行。
      - name: Node guard scopes
        if: always()
        run: |
          test -f scripts/verify_multiversion.py \
            || { echo "::error::缺少 scripts/verify_multiversion.py（node scopes）"; exit 1; }
          for scope in unit server optional-server package spotbugs; do
            echo "::group::verify_multiversion $scope"
            python3 -I scripts/verify_multiversion.py --root . --scope "$scope" --node "${{ matrix.node }}"
            echo "::endgroup::"
          done

      - name: Unit test summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py unit --suite platform --node "${{ matrix.node }}" \
            --results "versions/${{ matrix.node }}/build/test-results/test" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Server GameTest summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py server --backend legacy \
            --run-dir ".runs/${{ matrix.node }}/legacy-server" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -I .github/scripts/ci_guard.py server --backend foundation \
            --run-dir ".runs/${{ matrix.node }}/foundation-server" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -I .github/scripts/ci_guard.py server --backend optional-legacy \
            --run-dir ".runs/${{ matrix.node }}/optional-legacy-server" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -I .github/scripts/ci_guard.py server --backend optional-foundation \
            --run-dir ".runs/${{ matrix.node }}/optional-foundation-server" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stonecutter generated source summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py generated --root . --node "${{ matrix.node }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # 平台 SpotBugs 每节点独立 <= 28，由 verify_multiversion spotbugs scope 核验；
      # 这里只汇总，不复制基线数字。
      - name: SpotBugs summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py spotbugs --suite platform --node "${{ matrix.node }}" \
            --report "versions/${{ matrix.node }}/build/reports/spotbugs/main.xml" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: JaCoCo summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py jacoco --suite platform --node "${{ matrix.node }}" \
            --report "versions/${{ matrix.node }}/build/reports/jacoco/test/jacocoTestReport.xml" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Distributable jar guard
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py artifact --root . --node "${{ matrix.node }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Platform conclusion
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- 结论: 通过（单测、四个服务端 GameTest、SpotBugs、产物）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 结论: 失败，详见本 job 日志与上传的报告/运行目录" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: SyncMaterial-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/SyncMaterial-${{ matrix.node }}-*.jar
            !versions/${{ matrix.node }}/build/libs/*-sources.jar
          retention-days: 30

      - name: Upload platform reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/reports/tests/
            versions/${{ matrix.node }}/build/test-results/
            versions/${{ matrix.node }}/build/reports/jacoco/
            versions/${{ matrix.node }}/build/reports/spotbugs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload server run artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: server-gametest-${{ matrix.node }}
          path: |
            .runs/${{ matrix.node }}/*-server/logs/
            .runs/${{ matrix.node }}/*-server/crash-reports/
          retention-days: 7
          if-no-files-found: ignore

  client:
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21 (toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Java 25 (build JVM)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Gradle (${{ matrix.node }})
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-client-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'versions/versions.json') }}
          restore-keys: |
            gradle-client-${{ runner.os }}-${{ matrix.slug }}-
            gradle-${{ runner.os }}-${{ matrix.slug }}-
            gradle-${{ runner.os }}-

      # 真实客户端需要 GL 上下文；runner 无显卡，用 Mesa 软件渲染 + xvfb。
      - name: Install virtual display and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri mesa-vulkan-drivers \
            libxi6 libxcursor1 libxrandr2 libxinerama1 libxxf86vm1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Record root source hash before client runs
        run: |
          python3 -I .github/scripts/ci_guard.py source-hash --root . --path src \
            --out "$RUNNER_TEMP/src-before-client-${{ matrix.slug }}.sha"

      - name: Prepare client run directories
        run: |
          mkdir -p ".runs/${{ matrix.node }}/legacy-client" \
                   ".runs/${{ matrix.node }}/foundation-client" \
                   ".runs/${{ matrix.node }}/optional-legacy-client" \
                   ".runs/${{ matrix.node }}/optional-foundation-client"

      - name: Start client summary
        run: echo "## 客户端回归 ${{ matrix.node }}（Java ${{ matrix.java }}）" >> "$GITHUB_STEP_SUMMARY"

      # 四个客户端任务分开执行，保证一个后端失败时其余入口仍被真实运行。
      # --no-build-cache 避免客户端测试任务被缓存结果顶替。
      - name: Legacy client GameTest
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_GL_VERSION_OVERRIDE: 4.6
          MESA_GLSL_VERSION_OVERRIDE: 460
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            ./gradlew :${{ matrix.node }}:runClientGameTest --no-build-cache --stacktrace

      - name: Foundation client GameTest
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_GL_VERSION_OVERRIDE: 4.6
          MESA_GLSL_VERSION_OVERRIDE: 460
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            ./gradlew :${{ matrix.node }}:runFoundationClientGameTest --no-build-cache --stacktrace

      - name: Optional dependency legacy client GameTest
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_GL_VERSION_OVERRIDE: 4.6
          MESA_GLSL_VERSION_OVERRIDE: 460
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            ./gradlew :${{ matrix.node }}:runOptionalClientGameTest --no-build-cache --stacktrace

      - name: Optional dependency foundation client GameTest
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          MESA_GL_VERSION_OVERRIDE: 4.6
          MESA_GLSL_VERSION_OVERRIDE: 460
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            ./gradlew :${{ matrix.node }}:runOptionalFoundationClientGameTest --no-build-cache --stacktrace

      # 客户端真实执行以 verify_multiversion client scope 为准；这里只汇总标签，
      # 不复制 23/2/1 等基线数字，避免双基线漂移。
      - name: Legacy client test summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py client --mod syncmaterial-test \
            --metadata src/gametest/resources/fabric.mod.json --node "${{ matrix.node }}" \
            --run-dir ".runs/${{ matrix.node }}/legacy-client" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Foundation client test summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py client --mod syncmaterial-foundation-test \
            --metadata src/foundationtest/resources/fabric.mod.json --node "${{ matrix.node }}" \
            --run-dir ".runs/${{ matrix.node }}/foundation-client" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Optional legacy client test summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py client --mod syncmaterial-optional-test \
            --metadata src/optionaltest/resources/fabric.mod.json --node "${{ matrix.node }}" \
            --run-dir ".runs/${{ matrix.node }}/optional-legacy-client" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Optional foundation client test summary
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py client --mod syncmaterial-optional-test \
            --metadata src/optionaltest/resources/fabric.mod.json --node "${{ matrix.node }}" \
            --run-dir ".runs/${{ matrix.node }}/optional-foundation-client" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Client guard scopes
        if: always()
        run: |
          test -f scripts/verify_multiversion.py \
            || { echo "::error::缺少 scripts/verify_multiversion.py（client scopes）"; exit 1; }
          python3 -I scripts/verify_multiversion.py --root . --scope client --node "${{ matrix.node }}"
          python3 -I scripts/verify_multiversion.py --root . --scope optional-client --node "${{ matrix.node }}"

      - name: Verify source hash unchanged
        if: always()
        run: |
          set -o pipefail
          python3 -I .github/scripts/ci_guard.py source-compare --root . --path src \
            --before "$RUNNER_TEMP/src-before-client-${{ matrix.slug }}.sha" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Client conclusion
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "- 结论: 通过（全部客户端入口真实 PASS，详见 verify_multiversion client scope）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 结论: 失败，详见本 job 日志与上传的客户端运行目录" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload client run artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: client-gametest-${{ matrix.node }}
          path: |
            .runs/${{ matrix.node }}/*-client/logs/
            .runs/${{ matrix.node }}/*-client/crash-reports/
            .runs/${{ matrix.node }}/*-client/screenshots/
          retention-days: 7
          if-no-files-found: ignore

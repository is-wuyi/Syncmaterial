# 这些属性是 build.gradle 与 fabric.mod.json 的唯一版本来源，
# 不要在 build.gradle 里写死版本号 —— 两处各写一份必然会漂移。
minecraft_version=1.21.7
yarn_mappings=1.21.7+build.1
loader_version=0.16.13
fabric_api_version=0.129.0+1.21.7

# 声明给 Fabric Loader 的运行时兼容区间（写入 fabric.mod.json）。
# 与 minecraft_version 分开：编译只用一个版本，但产物可运行于一个区间。
minecraft_dependency=>=1.21.7 <=1.21.8
loader_dependency=>=0.16.9

# 第三方 mod（均为 modCompileOnly，运行时不强制要求）
malilib_version=0.25.7
litematica_version=0.23.7

# 嵌入的 SQLite 驱动
sqlite_version=3.45.1.0

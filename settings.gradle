pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.10'
}

rootProject.name = 'SyncMaterial'
include 'shared'

List<String> supportedVersions = new groovy.json.JsonSlurper()
        .parse(file('versions/versions.json')).minecraft

stonecutter {
    create(rootProject) {
        versions(*supportedVersions)
        vcsVersion = '26.2'
    }
}

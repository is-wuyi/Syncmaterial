pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.7'
}

stonecutter {
    centralScript = 'build.gradle'
    create(rootProject) {
        version('1.21.7', '1.21.7')
        vcsVersion = '1.21.7'
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.10'
}

evaluationDependsOn(':shared')

boolean modern = minecraft_mapping == 'none'
apply plugin: modern ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

version = "${minecraft_version}-${mod_version}"
group = 'net.syncmaterial'
base.archivesName = 'SyncMaterial'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://repo.maven.apache.org/maven2/' } }
        filter {
            includeModule('com.github.stephenc.jcip', 'jcip-annotations')
            includeGroup('org.ow2.asm')
        }
    }
    maven {
        url = 'https://maven.lucko.me/'
        content { includeModule('me.lucko', 'fabric-permissions-api') }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (modern) {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        compileOnly "maven.modrinth:malilib:${malilib_dependency}"
        compileOnly "maven.modrinth:litematica:${litematica_dependency}"
        compileOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
        runtimeOnly "maven.modrinth:malilib:${malilib_dependency}"
        runtimeOnly "maven.modrinth:litematica:${litematica_dependency}"
        runtimeOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        modCompileOnly "maven.modrinth:malilib:${malilib_dependency}"
        modCompileOnly "maven.modrinth:litematica:${litematica_dependency}"
        modCompileOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
        modRuntimeOnly "maven.modrinth:malilib:${malilib_dependency}"
        modRuntimeOnly "maven.modrinth:litematica:${litematica_dependency}"
        modRuntimeOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
        // Loom removes nested mod jars from dev dependencies; Syncmatica 0.3.15 needs its permissions API at runtime.
        modRuntimeOnly 'me.lucko:fabric-permissions-api:0.4.1'
    }
    implementation project(':shared')
    include project(':shared')
    include "org.xerial:sqlite-jdbc:${sqlite_version}"
    implementation "org.xerial:sqlite-jdbc:${sqlite_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly "org.slf4j:slf4j-simple:${slf4j_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', minecraft_dependency
    inputs.property 'loader_dependency', ">=${loader_version}"
    inputs.property 'java_version', java_version
    inputs.property 'malilib_version', malilib_version
    inputs.property 'litematica_version', litematica_version
    inputs.property 'syncmatica_version', syncmatica_version
    filesMatching('fabric.mod.json') {
        expand(version: project.version, minecraft_dependency: minecraft_dependency,
                loader_dependency: ">=${loader_version}", java_version: java_version,
                malilib_version: malilib_version,
                litematica_version: litematica_version, syncmatica_version: syncmatica_version)
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
    options.compilerArgs += ['-Xlint:all,-classfile,-processing,-this-escape,-serial', '-Xmaxerrs', '1000']
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    doFirst {
        def authlib = classpath.files.findAll { it.name.startsWith('authlib-') }
        if (!authlib.isEmpty()) systemProperty 'fabric.systemLibraries', authlib.collect { it.absolutePath }.join(File.pathSeparator)
    }
}
test.finalizedBy jacocoTestReport
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                'net/syncmaterial/syncmaterial/client/gui/widgets/**',
                'net/syncmaterial/syncmaterial/client/render/**',
                'net/syncmaterial/syncmaterial/client/config/**',
                'net/syncmaterial/syncmaterial/client/infohud/**',
                'net/syncmaterial/syncmaterial/mixin/**',
                'net/syncmaterial/syncmaterial/client/SyncMaterialClient*',
                'net/syncmaterial/syncmaterial/client/gui/Gui*',
                'net/syncmaterial/syncmaterial/client/gui/StagingAreaSelector*',
                'net/syncmaterial/syncmaterial/client/gui/SyncMaterialList*',
                'net/syncmaterial/syncmaterial/client/gui/MaterialListHudRenderer*'])
    }))
}

spotbugs {
    ignoreFailures = true
    effort = 'max'
    reportLevel = 'default'
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
}
spotbugsMain {
    reports {
        xml.required = true
        html.required = true
    }
}
tasks.matching { it.name in ['spotbugsTest', 'spotbugsGametest', 'spotbugsFoundationtest', 'spotbugsOptionaltest'] }.configureEach {
    enabled = false
}

sourceSets {
    optionaltest {
        java.srcDirs = []
        resources.srcDirs = [rootProject.file('src/optionaltest/resources')]
    }
    foundationtest {
        java.srcDirs = []
        resources.srcDirs = [rootProject.file('src/foundationtest/resources')]
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'syncmaterial-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        clearRunDirectory = false
    }
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'minecraft_dependency', minecraft_dependency
    filesMatching('fabric.mod.json') {
        expand(minecraft_dependency: minecraft_dependency)
    }
}

File runRoot = rootProject.file(".runs/${minecraft_version}")
afterEvaluate {
    def gameTestRun = loom.runs.getByName('gameTest')
    def clientGameTestRun = loom.runs.getByName('clientGameTest')
    gameTestRun.runDir = new File(runRoot, 'legacy-server').absolutePath
    clientGameTestRun.runDir = new File(runRoot, 'legacy-client').absolutePath
    def foundationResources = sourceSets.foundationtest.output.resourcesDir
    loom.runs.create('foundationGameTest') {
        inherit gameTestRun
        source sourceSets.gametest
        property 'syncmaterial.backend', 'foundation'
        property 'fabric-api.gametest', ''
        property 'fabric-api.gametest.filter', 'syncmaterial-foundation-test:foundation_*'
        runDir = new File(runRoot, 'foundation-server').absolutePath
    }
    loom.runs.create('foundationClientGameTest') {
        inherit clientGameTestRun
        source sourceSets.gametest
        property 'syncmaterial.backend', 'foundation'
        property 'fabric.client.gametest', ''
        property 'fabric.client.gametest.modid', 'syncmaterial-foundation-test'
        property 'fabric.client.gametest.testModResourcesPath', foundationResources.absolutePath
        runDir = new File(runRoot, 'foundation-client').absolutePath
    }
    loom.mods {
        'syncmaterial-foundation-test' { sourceSet sourceSets.foundationtest }
        'syncmaterial' { sourceSet sourceSets.main }
        'syncmaterial-shared' { sourceSet('main', project(':shared')) }
    }
    tasks.matching { it.name in ['runFoundationGameTest', 'runFoundationClientGameTest'] }.configureEach {
        dependsOn tasks.named('gametestClasses'), tasks.named('foundationtestClasses')
        classpath += files(foundationResources)
        doFirst {
            def directory = new File(runRoot, name == 'runFoundationClientGameTest' ? 'foundation-client' : 'foundation-server')
            directory.mkdirs()
            new File(directory, 'eula.txt').text = 'eula=true\n'
        }
    }
    tasks.named('runFoundationClientGameTest') { mustRunAfter tasks.named('runClientGameTest') }
    tasks.named('runFoundationGameTest') { mustRunAfter tasks.named('runGameTest') }
    Map<String, String> standardRuns = [runGameTest: 'legacy-server',
            runClientGameTest: 'legacy-client', runFoundationGameTest: 'foundation-server',
            runFoundationClientGameTest: 'foundation-client']
    standardRuns.each { taskName, directory ->
        def clearTask = tasks.register("clear${taskName.substring(0, 1).toUpperCase(Locale.ROOT)}${taskName.substring(1)}", Delete) {
            delete new File(runRoot, directory)
        }
        tasks.named(taskName) {
            dependsOn clearTask
            doFirst {
                def runDirectory = new File(runRoot, directory)
                runDirectory.mkdirs()
                new File(runDirectory, 'eula.txt').text = 'eula=true\n'
            }
        }
    }

    def optionalResources = sourceSets.optionaltest.output.resourcesDir
    loom.mods {
        'syncmaterial-optional-test' { sourceSet sourceSets.optionaltest }
    }
    def sharedProject = project(':shared')
    def sharedJar = sharedProject.tasks.named('jar').get().archiveFile.get().asFile
    String optionalClassPathGroups = [
            sourceSets.main.output.files,
            sharedProject.sourceSets.main.output.files + [sharedJar],
            sourceSets.gametest.output.classesDirs.files + [optionalResources]]
            .collect { group -> group.collect { it.absolutePath }.join(File.pathSeparator) }
            .join(File.pathSeparator + File.pathSeparator)
    Map<String, List> optionalRuns = [
            optionalGameTest: [false, false],
            optionalFoundationGameTest: [true, false],
            optionalClientGameTest: [false, true],
            optionalFoundationClientGameTest: [true, true]]
    optionalRuns.each { runName, mode ->
        boolean foundation = mode[0]
        boolean client = mode[1]
        String directory = "optional-${foundation ? 'foundation' : 'legacy'}-${client ? 'client' : 'server'}"
        loom.runs.create(runName) {
            inherit client ? clientGameTestRun : gameTestRun
            source sourceSets.gametest
            property 'syncmaterial.backend', foundation ? 'foundation' : 'legacy'
            property 'fabric.debug.disableModIds', 'malilib,litematica,syncmatica,syncmaterial-test,syncmaterial-foundation-test'
            property 'fabric.classPathGroups', optionalClassPathGroups
            if (client) {
                property 'fabric.client.gametest', ''
                property 'fabric.client.gametest.modid', 'syncmaterial-optional-test'
                property 'fabric.client.gametest.testModResourcesPath', optionalResources.absolutePath
            } else {
                property 'fabric-api.gametest', ''
                property 'fabric-api.gametest.filter', 'syncmaterial-optional-test:optional_dependency_server_game_test_*'
            }
            runDir = new File(runRoot, directory).absolutePath
        }
        String taskName = 'run' + runName.substring(0, 1).toUpperCase(Locale.ROOT) + runName.substring(1)
        def clearTask = tasks.register("clear${taskName.substring(0, 1).toUpperCase(Locale.ROOT)}${taskName.substring(1)}", Delete) {
            delete new File(runRoot, directory)
        }
        tasks.named(taskName) {
            dependsOn clearTask, tasks.named('gametestClasses'), tasks.named('optionaltestClasses'), tasks.named('generateDLIConfig')
            useArgFile.set(false)
            classpath += files(optionalResources)
            classpath = classpath.filter { candidate ->
                String name = candidate.name.toLowerCase(Locale.ROOT)
                !name.contains('malilib') && !name.contains('litematica') && !name.contains('syncmatica')
                        && candidate != sourceSets.gametest.output.resourcesDir
                        && candidate != foundationResources
            }
            doFirst {
                // DLI 从配置文件覆盖同名系统属性；每个运行用自己的配置保持测试类组隔离。
                File originalConfig = rootProject.file(".gradle/loom-cache/projects/${minecraft_version}/launch.cfg")
                File isolatedConfig = layout.buildDirectory.file("optional-launch/${runName}.cfg").get().asFile
                isolatedConfig.parentFile.mkdirs()
                isolatedConfig.text = originalConfig.readLines().collect { line ->
                    line.trim().startsWith('fabric.classPathGroups=')
                            ? "\tfabric.classPathGroups=${optionalClassPathGroups}" : line
                }.join('\n') + '\n'
                // JVM 参数提供器晚于系统属性，必须替换 Loom 的原始 DLI 配置参数。
                jvmArgumentProviders.clear()
                jvmArgs getInternalJvmArgs().get().findAll { !it.startsWith('-Dfabric.dli.config=') }
                jvmArgs '-cp', classpath.asPath
                systemProperty 'fabric.dli.config', isolatedConfig.absolutePath
                def runDirectory = new File(runRoot, directory)
                runDirectory.mkdirs()
                new File(runDirectory, 'eula.txt').text = 'eula=true\n'
            }
            mustRunAfter tasks.named(client ? 'runFoundationClientGameTest' : 'runFoundationGameTest')
        }
    }
}

def verifyPlatform = tasks.register('verifyPlatform', Exec) {
    dependsOn tasks.named('build'), tasks.named('spotbugsMain'), tasks.named('runGameTest'), tasks.named('runFoundationGameTest')
    commandLine 'python3', '-I', rootProject.file('scripts/verify_multiversion.py').absolutePath,
            '--root', rootProject.projectDir.absolutePath, '--node', minecraft_version,
            '--scope', 'unit,server,package,spotbugs', '--strict'
}

tasks.register('checkPlatform') {
    dependsOn verifyPlatform
}

tasks.register('writeCompileClasspath') {
    dependsOn tasks.named('classes')
    doLast { file("${rootProject.projectDir}/classpath-${minecraft_version}.txt").text = sourceSets.main.compileClasspath.asPath }
}

// Gradle settings for SyncMaterial
plugins {
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.10'
}

// 26.2 用 Mojang 官方映射直读（minecraft_mapping=none → fabric-loom 原生，不 remap）
if (minecraft_mapping == 'none') {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
}

version = "${minecraft_version}-${mod_version}"
group = "net.syncmaterial"

base {
    archivesName = "SyncMaterial"
}

repositories {
    // 核心：Fabric 官方仓库（必须放第一个）
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url "https://maven.meteordev.org/releases" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://www.cursemaven.com" }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (minecraft_mapping != 'none') {
        if (minecraft_mapping == 'mojmap') {
            mappings loom.officialMojangMappings()
        } else {
            mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        }
    }
    if (minecraft_mapping == 'none') {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        compileOnly "maven.modrinth:malilib:${malilib_dependency}"
        compileOnly "maven.modrinth:litematica:${litematica_dependency}"
        compileOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
        testCompileOnly "maven.modrinth:malilib:${malilib_dependency}"
        testCompileOnly "maven.modrinth:litematica:${litematica_dependency}"
        testCompileOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
        runtimeOnly "maven.modrinth:malilib:${malilib_dependency}"
        runtimeOnly "maven.modrinth:litematica:${litematica_dependency}"
        runtimeOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
        implementation "com.google.code.findbugs:jsr305:3.0.2"
        implementation "org.xerial:sqlite-jdbc:${sqlite_version}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        modCompileOnly "maven.modrinth:malilib:${malilib_dependency}"
        modCompileOnly "maven.modrinth:litematica:${litematica_dependency}"
        modCompileOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
        modRuntimeOnly "maven.modrinth:malilib:${malilib_dependency}"
        modRuntimeOnly "maven.modrinth:litematica:${litematica_dependency}"
        modRuntimeOnly "maven.modrinth:syncmatica:${syncmatica_dependency}"
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
        include "org.xerial:sqlite-jdbc:${sqlite_version}"
        runtimeOnly "org.xerial:sqlite-jdbc:${sqlite_version}"
        testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "org.xerial:sqlite-jdbc:${sqlite_version}"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.13"
}

processResources {
    // 版本号统一从 gradle.properties 注入，避免 fabric.mod.json 里写死后与构建配置漂移
    inputs.property "version", project.version
    inputs.property "minecraft_dependency", minecraft_dependency
    inputs.property "loader_dependency", loader_dependency
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_dependency": minecraft_dependency,
            "loader_dependency": loader_dependency
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // 编译期静态检查。排除对本项目无意义的类别：
    //   classfile/processing —— 第三方 jar（guava/gson 缺 errorprone 注解）产生，无法修
    //   this-escape        —— MaLiLib 控件基类要求构造器中 addButton，是上游继承模式固有产物
    //   serial             —— Minecraft 相关类普遍不声明 serialVersionUID
    // 不加 -Werror：警告不阻塞构建，避免上游 API 废弃时卡住开发
    options.compilerArgs << '-Xlint:all,-classfile,-processing,-this-escape,-serial'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // 排除 JUnit 环境物理上无法执行的渲染/屏幕/输入层（需要真实客户端渲染循环）。
    // 保留已测的纯逻辑类：InventoryWatcher、MaterialListBase、MaterialListUtils。
    // 排除后覆盖率反映"可单测代码"的真实情况，数字升降才有趋势意义。
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            'net/syncmaterial/syncmaterial/client/gui/widgets/**',
            'net/syncmaterial/syncmaterial/client/render/**',
            'net/syncmaterial/syncmaterial/client/config/**',
            'net/syncmaterial/syncmaterial/client/infohud/**',
            'net/syncmaterial/syncmaterial/mixin/**',
            'net/syncmaterial/syncmaterial/client/SyncMaterialClient*',
            // client.gui 中依赖屏幕/控件/渲染的类（含嵌套类）
            'net/syncmaterial/syncmaterial/client/gui/Gui*',
            'net/syncmaterial/syncmaterial/client/gui/StagingAreaSelector*',
            'net/syncmaterial/syncmaterial/client/gui/SyncMaterialList*',
            'net/syncmaterial/syncmaterial/client/gui/MaterialListHudRenderer*',
        ])
    }))
}

test {
    finalizedBy jacocoTestReport
}

// 静态分析（SpotBugs）。只分析主源集，测试/GameTest 源集不参与：
// 测试代码里的 mock 与断言模式会产生大量无意义告警。
spotbugs {
    ignoreFailures = true          // 不阻塞构建，静态分析是体检而非门禁
    effort = 'max'
    reportLevel = 'default'
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
}
tasks.named('spotbugsMain') {
    reports {
        xml.required = true        // CI 汇总用
        html.required = true       // 人工查看用
    }
}
// 测试源集不跑静态分析
tasks.matching { it.name in ['spotbugsTest', 'spotbugsGametest'] }.configureEach {
    enabled = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(minecraft_mapping == 'none' ? 25 : 21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// 服务端 GameTest 配置
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "syncmaterial-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

afterEvaluate {
    // GameTest 运行目录改到本地磁盘（项目在外置 exFAT 硬盘上，不支持文件锁）
    // 必须在 afterEvaluate 中设置：configureTests 在此阶段才创建 gameTest run 配置
    def gameTestRun = loom.runs.findByName("gameTest")
    if (gameTestRun != null) {
        gameTestRun.runDir = rootProject.file("/tmp/syncmaterial-gametest/run")
    }

    // gametest 源集运行时依赖（SQLite 驱动）
    if (configurations.findByName("gametestRuntimeOnly") != null) {
        dependencies {
            gametestRuntimeOnly "org.xerial:sqlite-jdbc:${sqlite_version}"
        }
    }
}

// Gradle settings for SyncMaterial
plugins {
    id 'fabric-loom' version '1.14.10'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.10'
}

version = "1.21.7-0.3.0-beta.41"
group = "net.syncmaterial"

repositories {
    // 核心：Fabric 官方仓库（必须放第一个）
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url "https://maven.meteordev.org/releases" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://www.cursemaven.com" }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.7"
    mappings "net.fabricmc:yarn:1.21.7+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.13"

    // ✅ 修复：MC 1.21.7 官方正版 Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.129.0+1.21.7"

    // MaLiLib for GUI classes (compile-time only in production)
    modCompileOnly "maven.modrinth:malilib:0.25.7"
    // 客户端 GameTest 会启动真实客户端，需把 compileOnly 依赖补到开发运行时；
    // modRuntimeOnly 不会嵌入生产 jar，只影响 Loom 的 run 配置
    modRuntimeOnly "maven.modrinth:malilib:0.25.7"

    // Litematica for reference (compile-time only, not required at runtime)
    // 0.23.6 已从 Modrinth 下架，改用 0.23.7（同系列补丁版本，支持 1.21.6~1.21.8）
    modCompileOnly "maven.modrinth:litematica:0.23.7"
    modRuntimeOnly "maven.modrinth:litematica:0.23.7"

    // JSR 305 (javax.annotation.Nullable 等)
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // SQLite 数据库驱动 - include 嵌入模组 jar（生产）；runtimeOnly 提供 dev 运行时（runServer/GameTest）
    include "org.xerial:sqlite-jdbc:3.45.1.0"
    runtimeOnly "org.xerial:sqlite-jdbc:3.45.1.0"

    // 测试依赖
    testImplementation "net.fabricmc:fabric-loader-junit:0.16.13"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.xerial:sqlite-jdbc:3.45.1.0"
    // 单测 JVM 的日志输出（此前无 slf4j 绑定，生产代码吞掉的异常在单测里完全不可见）
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.13"
    // selection 包的 Box/AreaSelection 引用 litematica 的 Corner 枚举，
    // 单测加载这些类需要重映射后的 mod jar（loom 把 modCompileOnly 重映射产物
    // 放在 .gradle/loom-cache/remapped_mods，只挂在编译类路径，这里补到运行时）
    testRuntimeOnly fileTree(".gradle/loom-cache/remapped_mods/remapped/maven/modrinth") {
        include "litematica-*/0.23.7/*.jar"
        include "malilib-*/0.25.7/*.jar"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // 编译期静态检查。排除对本项目无意义的类别：
    //   classfile/processing —— 第三方 jar（guava/gson 缺 errorprone 注解）产生，无法修
    //   this-escape        —— MaLiLib 控件基类要求构造器中 addButton，是上游继承模式固有产物
    //   serial             —— Minecraft 相关类普遍不声明 serialVersionUID
    // 不加 -Werror：警告不阻塞构建，避免上游 API 废弃时卡住开发
    options.compilerArgs << '-Xlint:all,-classfile,-processing,-this-escape,-serial'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // 排除 JUnit 环境物理上无法执行的渲染/屏幕/输入层（需要真实客户端渲染循环）。
    // 保留已测的纯逻辑类：InventoryWatcher、MaterialListBase、MaterialListUtils。
    // 排除后覆盖率反映"可单测代码"的真实情况，数字升降才有趋势意义。
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            'net/syncmaterial/syncmaterial/client/gui/widgets/**',
            'net/syncmaterial/syncmaterial/client/render/**',
            'net/syncmaterial/syncmaterial/client/config/**',
            'net/syncmaterial/syncmaterial/client/infohud/**',
            'net/syncmaterial/syncmaterial/mixin/**',
            'net/syncmaterial/syncmaterial/client/SyncMaterialClient*',
            // client.gui 中依赖屏幕/控件/渲染的类（含嵌套类）
            'net/syncmaterial/syncmaterial/client/gui/Gui*',
            'net/syncmaterial/syncmaterial/client/gui/StagingAreaSelector*',
            'net/syncmaterial/syncmaterial/client/gui/SyncMaterialList*',
            'net/syncmaterial/syncmaterial/client/gui/MaterialListHudRenderer*',
        ])
    }))
}

test {
    finalizedBy jacocoTestReport
}

// 静态分析（SpotBugs）。只分析主源集，测试/GameTest 源集不参与：
// 测试代码里的 mock 与断言模式会产生大量无意义告警。
spotbugs {
    ignoreFailures = true          // 不阻塞构建，静态分析是体检而非门禁
    effort = 'max'
    reportLevel = 'default'
    excludeFilter = file('config/spotbugs/exclude.xml')
}
tasks.named('spotbugsMain') {
    reports {
        xml.required = true        // CI 汇总用
        html.required = true       // 人工查看用
    }
}
// 测试源集不跑静态分析
tasks.matching { it.name in ['spotbugsTest', 'spotbugsGametest'] }.configureEach {
    enabled = false
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// 服务端 GameTest 配置
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "syncmaterial-test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

afterEvaluate {
    // GameTest 运行目录改到本地磁盘（项目在外置 exFAT 硬盘上，不支持文件锁）
    // 必须在 afterEvaluate 中设置：configureTests 在此阶段才创建 gameTest run 配置
    def gameTestRun = loom.runs.findByName("gameTest")
    if (gameTestRun != null) {
        gameTestRun.runDir = "/tmp/syncmaterial-gametest/run"
    }

    // 客户端 GameTest 同样需要 /tmp 运行目录。
    // Loom 1.14 的 RunConfig.runDir 是相对路径字符串；传绝对路径会被再次拼到
    // projectDir 下（/tmp/smc7/tmp/...），且 EULA 写到错误位置。项目本身已 rsync
    // 到 /tmp 构建，使用项目内 run-client 即可避开 exFAT 文件锁。
    def clientGameTestRun = loom.runs.findByName("clientGameTest")
    if (clientGameTestRun != null) {
        clientGameTestRun.runDir = "run-client"
        // 假人测试（MockBot）用 EmbeddedChannel 直接构造服务端连接，会被
        // fabric-client-gametest-api 4.x 的 NetworkSynchronizer 判定为
        // "低层级操作网络包"而崩溃；官方提示用该属性禁用同步器
        clientGameTestRun.vmArgs("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
    }

    // gametest 源集运行时依赖（SQLite 驱动）
    if (configurations.findByName("gametestRuntimeOnly") != null) {
        dependencies {
            gametestRuntimeOnly "org.xerial:sqlite-jdbc:3.45.1.0"
        }
    }
}